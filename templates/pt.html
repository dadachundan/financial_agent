<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price Target — FinAgent</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">
<style>
  body { background:#1a1d20; color:#e9ecef; font-size:.875rem; }
  table { font-size:.85rem; }
  thead th { position:sticky; top:0; background:#0d6efd; color:#fff; cursor:pointer; user-select:none; white-space:nowrap; z-index:5; }
  thead th .sort-ind { font-size:.7rem; color:#ffd; margin-left:4px; }
  tbody tr:hover { background:rgba(13,110,253,.10) !important; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ccy { font-size:.7rem; color:#9ca3af; margin-left:4px; }
  .sector-pill { font-size:.72rem; color:#cbd5e1; background:#374151; padding:1px 7px; border-radius:6px; white-space:nowrap; }
  .sector-pill:empty { display:none; }
  .up   { color:#4ade80; font-weight:600; }
  .down { color:#f87171; font-weight:600; }
  .rating-buy        { background:#198754; color:#fff; }
  .rating-outperform { background:#198754; color:#fff; }
  .rating-overweight { background:#198754; color:#fff; }
  .rating-toppick    { background:#157347; color:#fff; }
  .rating-neutral    { background:#6c757d; color:#fff; }
  .rating-mp         { background:#6c757d; color:#fff; }
  .rating-equal      { background:#6c757d; color:#fff; }
  .rating-uw         { background:#dc3545; color:#fff; }
  .rating-sell       { background:#dc3545; color:#fff; }
  .rating-up         { background:#dc3545; color:#fff; }
  .rating-pill { padding:1px 7px; border-radius:8px; font-size:.7rem; white-space:nowrap; }
  .filter-bar { background:#23272b; padding:10px 14px; border-radius:6px; margin-bottom:10px; position:sticky; top:0; z-index:6; }
  .pill-counts { font-size:.75rem; opacity:.8; }
  a.report-link { color:#7dd3fc; text-decoration:none; }
  a.report-link:hover { text-decoration:underline; }
  .catalyst { max-width:340px; font-size:.78rem; color:#cbd5e1; white-space:normal; }
  .table-dark { --bs-table-bg:#1a1d20; }

  /* Date slider */
  .date-slider-row { padding:4px 6px 8px 6px; }
  .date-slider-row .date-label { color:#9ca3af; font-size:.72rem; }
  .date-slider-row .date-val { color:#7dd3fc; font-weight:600; }
  #date-slider { margin:14px 6px 4px 6px; }
  .noUi-target { background:#3a3f44; border:none; box-shadow:none; height:4px; }
  .noUi-connect { background:#0d6efd; }
  .noUi-handle { background:#fff; border:none; box-shadow:0 0 0 2px #0d6efd, 0 1px 4px rgba(0,0,0,.4); border-radius:50%; width:16px !important; height:16px !important; top:-6px !important; right:-8px !important; cursor:pointer; }
  .noUi-handle:before, .noUi-handle:after { display:none; }
  .noUi-handle:focus { outline:none; box-shadow:0 0 0 3px #0d6efd, 0 1px 4px rgba(0,0,0,.4); }

  /* Avg PT column + ticker-group banding */
  .avg-pt { color:#fcd34d; font-weight:600; }
  .avg-pt .n { color:#9ca3af; font-weight:400; font-size:.7rem; margin-left:3px; }
  tbody tr.group-alt { background:rgba(255,255,255,.025); }
  tbody tr.group-first td { border-top:1px solid rgba(125,211,252,.25); }

  /* Pager */
  .pager { background:#23272b; padding:6px 12px; border-radius:6px; margin-bottom:8px; display:flex; gap:10px; align-items:center; font-size:.8rem; flex-wrap:wrap; }
  .pager button { background:#0d6efd; color:#fff; border:none; padding:3px 12px; border-radius:4px; cursor:pointer; font-size:.8rem; }
  .pager button:hover:not(:disabled) { background:#0b5ed7; }
  .pager button:disabled { opacity:.35; cursor:not-allowed; }
  .pager select { background:#1a1d20; color:#e9ecef; border:1px solid #3a3f44; padding:3px 8px; border-radius:4px; font-size:.8rem; }
  .pager .info { color:#9ca3af; font-variant-numeric:tabular-nums; }
  .pager .info strong { color:#e9ecef; }
  .loading-cell { text-align:center; padding:30px; color:#9ca3af; }
</style>
</head>
<body>
{{ NAV_HTML | safe }}
<div class="container-fluid px-3">
  <div class="filter-bar">
    <div class="date-slider-row">
      <div class="d-flex justify-content-between align-items-center">
        <span class="date-label">From <span id="date-min" class="date-val">--</span></span>
        <span class="date-label">📅 Report-date range</span>
        <span class="date-label">To <span id="date-max" class="date-val">--</span></span>
      </div>
      <div id="date-slider"></div>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-2">
      <input id="filter" type="text" class="form-control form-control-sm" style="max-width:340px"
             placeholder="🔍 filter by ticker / name / 中文名 / broker / rating">
      <span class="pill-counts">
        <span id="count">{{ total }}</span> rows
        &nbsp;|&nbsp;
        <span id="upBuy">0</span> Buy/OP/OW
        &nbsp;|&nbsp;
        <span id="upSell">0</span> Sell/UW
        &nbsp;|&nbsp;
        <span id="tickerCount">0</span> tickers
      </span>
      <span class="ms-auto small text-muted">grouped by ticker · click any column header to sort</span>
    </div>
  </div>

  <div class="pager">
    <button id="page-prev" type="button">◀ Prev</button>
    <button id="page-next" type="button">Next ▶</button>
    <span class="info" id="page-info">—</span>
    <span style="flex:1 1 auto"></span>
    <label class="info">Page size:
      <select id="page-size">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </label>
  </div>

  <div class="table-responsive" style="max-height:calc(100vh - 240px);">
    <table class="table table-dark table-hover table-sm align-middle" id="pt">
      <thead>
        <tr>
          <th data-key="report_date" data-default-dir="desc">Report Date<span class="sort-ind"></span></th>
          <th data-key="company_ticker">Ticker<span class="sort-ind"></span></th>
          <th data-key="company_name">Company<span class="sort-ind"></span></th>
          <th data-key="sector">Sector<span class="sort-ind"></span></th>
          <th data-key="research_institute">Broker<span class="sort-ind"></span></th>
          <th data-key="rating">Rating<span class="sort-ind"></span></th>
          <th data-key="price_target" data-num="1">PT<span class="sort-ind"></span></th>
          <th data-key="avg_pt" data-num="1" title="Average PT across all brokers covering this ticker in the selected date range">Avg PT<span class="sort-ind"></span></th>
          <th data-key="report_date_price" data-num="1">Px @ Report<span class="sort-ind"></span></th>
          <th data-key="upside_pct" data-num="1">Upside %<span class="sort-ind"></span></th>
          <th data-key="report_date_market_cap" data-num="1">Mkt Cap<span class="sort-ind"></span></th>
          <th data-key="catalyst">Catalyst<span class="sort-ind"></span></th>
          <th data-key="report_pdf_filename">Report PDF<span class="sort-ind"></span></th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="13" class="loading-cell">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
<script>
// Client-side paginated viewer. We fetch the full row set once as JSON
// (~3.8 MB for ~5k rows — half the HTML payload) and render only the
// current page (default 100 rows). Filter / sort / slider only touch the
// in-memory array, so even a 5k+ dataset stays interactive — the previous
// server-rendered version detached/reattached 5k <tr>s on every filter
// keystroke and that single op cost ~4.6s.
(function(){
  var tbody    = document.querySelector('#pt tbody');
  var filter   = document.getElementById('filter');
  var countEl  = document.getElementById('count');
  var upBuyEl  = document.getElementById('upBuy');
  var upSellEl = document.getElementById('upSell');
  var tickerCountEl = document.getElementById('tickerCount');
  var dateMinEl = document.getElementById('date-min');
  var dateMaxEl = document.getElementById('date-max');
  var sliderEl  = document.getElementById('date-slider');
  var pagePrev  = document.getElementById('page-prev');
  var pageNext  = document.getElementById('page-next');
  var pageInfo  = document.getElementById('page-info');
  var pageSizeSel = document.getElementById('page-size');

  var ONE_DAY = 86400000;
  var NUM_KEYS = ['price_target','avg_pt','report_date_price','upside_pct','report_date_market_cap'];

  var STATE = {
    all: [],            // every row from server, untouched
    visible: [],        // after date+text filter, sorted, ticker-grouped
    perTickerStats: {}, // ticker → {sum,n,ccyCount} (uses date-filtered only)
    sortKey: 'report_date',
    sortDir: 'desc',
    minTs: 0, maxTs: 0,
    curMinTs: 0, curMaxTs: 0,
    page: 0,
    pageSize: parseInt(pageSizeSel.value, 10) || 100,
  };

  function parseDate(s){ if(!s) return NaN; var t = Date.parse(s); return isNaN(t) ? NaN : t; }
  function fmtDate(t){
    var d = new Date(t);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth()+1).padStart(2,'0') + '-' +
      String(d.getUTCDate()).padStart(2,'0');
  }
  function esc(s){
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtNum(n, prec){
    if (n == null) return '';
    var p = prec == null ? 2 : prec;
    return Number(n).toFixed(p);
  }
  function fmtMktCap(n){
    if (!n) return '';
    if (n >= 1e12) return (n/1e12).toFixed(1) + 'T';
    if (n >= 1e9)  return (n/1e9).toFixed(1) + 'B';
    return (n/1e6).toFixed(0) + 'M';
  }
  function ratingClass(rating){
    if (!rating) return '';
    var rl = rating.toLowerCase();
    if (rl.indexOf('buy') >= 0)         return 'rating-buy';
    if (rl.indexOf('outperform') >= 0)  return 'rating-outperform';
    if (rl.indexOf('overweight') >= 0)  return 'rating-overweight';
    if (rl.indexOf('top pick') >= 0)    return 'rating-toppick';
    if (rl.indexOf('market-perform')>=0)return 'rating-mp';
    if (rl.indexOf('equal') >= 0)       return 'rating-equal';
    if (rl.indexOf('underweight') >= 0) return 'rating-uw';
    if (rl.indexOf('underperform') >= 0)return 'rating-up';
    if (rl.indexOf('sell') >= 0)        return 'rating-sell';
    if (rl.indexOf('neutral') >= 0)     return 'rating-neutral';
    return 'rating-neutral';
  }
  function searchText(r){
    // Cached on the row object; rebuilt on first access only.
    if (r._search != null) return r._search;
    r._search = [
      r.company_ticker, r.company_name, r.research_institute,
      r.rating, r.sector, r.report_pdf_filename, r.catalyst
    ].filter(Boolean).join(' ').toLowerCase();
    return r._search;
  }

  function rowHtml(r){
    var ratingPill = r.rating
      ? '<span class="rating-pill ' + ratingClass(r.rating) + '">' + esc(r.rating) + '</span>'
      : '';
    var ptCell = r.price_target != null
      ? fmtNum(r.price_target, 2) + '<span class="ccy">' + esc(r.target_currency || '') + '</span>'
      : '';
    var avgPtCell = '';
    if (r._avgPt != null) {
      avgPtCell = fmtNum(r._avgPt, 2)
        + '<span class="ccy">' + esc(r._avgPtCcy || '') + '</span>'
        + (r._avgPtSuffix || '');
    }
    var pxCell = r.report_date_price != null
      ? fmtNum(r.report_date_price, 2) + '<span class="ccy">' + esc(r.price_currency || r.target_currency || '') + '</span>'
      : '';
    var upsideClass = '';
    var upsideTxt = '';
    if (r.upside_pct != null) {
      upsideClass = r.upside_pct > 0 ? 'up' : (r.upside_pct < 0 ? 'down' : '');
      upsideTxt = (r.upside_pct > 0 ? '+' : '') + Number(r.upside_pct).toFixed(1) + '%';
    }
    var mktCapCell = r.report_date_market_cap
      ? fmtMktCap(r.report_date_market_cap) + '<span class="ccy">' + esc(r.price_currency || '') + '</span>'
      : '';
    var pdfCell = '';
    if (r.report_file_id) {
      var name = r.report_pdf_filename || ('file_id ' + r.report_file_id);
      var short = name.length > 48 ? name.substring(0, 48) + '…' : name;
      pdfCell = '<a class="report-link" href="/zsxq/pdf-viewer/' + esc(r.report_file_id) + '" target="_blank" title="' + esc(r.report_pdf_filename || '') + '">' + esc(short) + '</a>';
    }
    var rowClasses = [];
    if (r._alt) rowClasses.push('group-alt');
    if (r._isFirst) rowClasses.push('group-first');

    return '<tr' + (rowClasses.length ? ' class="' + rowClasses.join(' ') + '"' : '') + '>'
      + '<td>' + esc(r.report_date || '') + '</td>'
      + '<td><strong>' + esc(r.company_ticker) + '</strong></td>'
      + '<td>' + esc(r.company_name || '') + '</td>'
      + '<td><span class="sector-pill">' + esc(r.sector || '') + '</span></td>'
      + '<td>' + esc(r.research_institute || '') + '</td>'
      + '<td>' + ratingPill + '</td>'
      + '<td class="num">' + ptCell + '</td>'
      + '<td class="num avg-pt">' + avgPtCell + '</td>'
      + '<td class="num">' + pxCell + '</td>'
      + '<td class="num ' + upsideClass + '">' + upsideTxt + '</td>'
      + '<td class="num">' + mktCapCell + '</td>'
      + '<td class="catalyst">' + esc(r.catalyst || '') + '</td>'
      + '<td>' + pdfCell + '</td>'
      + '</tr>';
  }

  function sortRows(arr){
    var key = STATE.sortKey, dir = STATE.sortDir;
    var isNum = NUM_KEYS.indexOf(key) >= 0;
    arr.sort(function(a, b){
      var av, bv;
      if (key === 'avg_pt') {
        var sa = STATE.perTickerStats[a.company_ticker];
        var sb = STATE.perTickerStats[b.company_ticker];
        av = sa && sa.n ? sa.sum / sa.n : null;
        bv = sb && sb.n ? sb.sum / sb.n : null;
      } else {
        av = a[key]; bv = b[key];
      }
      if (isNum) {
        if (av == null || isNaN(av)) av = dir === 'asc' ? Infinity : -Infinity;
        if (bv == null || isNaN(bv)) bv = dir === 'asc' ? Infinity : -Infinity;
        return dir === 'asc' ? av - bv : bv - av;
      }
      av = av == null ? '' : String(av);
      bv = bv == null ? '' : String(bv);
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
  }

  function recompute(){
    var minTs = STATE.curMinTs, maxTs = STATE.curMaxTs;
    var q = filter.value.trim().toLowerCase();
    var tokens = q ? q.split(/\s+/) : [];

    // 1. Date filter — used both for visibility and stats.
    var dateFiltered = STATE.all.filter(function(r){
      var t = parseDate(r.report_date);
      if (isNaN(t)) return true;
      return t >= minTs && t <= maxTs;
    });

    // 2. Stats from date-filtered rows ONLY (text filter narrows display,
    //    not the consensus calc).
    STATE.perTickerStats = {};
    dateFiltered.forEach(function(r){
      var pt = r.price_target;
      var ticker = r.company_ticker;
      if (!ticker || pt == null) return;
      var s = STATE.perTickerStats[ticker];
      if (!s) { s = { sum:0, n:0, ccyCount:{} }; STATE.perTickerStats[ticker] = s; }
      s.sum += pt; s.n += 1;
      var ccy = r.target_currency || '';
      s.ccyCount[ccy] = (s.ccyCount[ccy] || 0) + 1;
    });

    // 3. Text filter applied on top.
    var shown = tokens.length === 0 ? dateFiltered.slice() : dateFiltered.filter(function(r){
      var txt = searchText(r);
      return tokens.every(function(t){ return txt.indexOf(t) >= 0; });
    });

    // 4. Sort.
    sortRows(shown);

    // 5. Group by ticker (preserve sort order; ticker order = first-seen).
    var groups = new Map();
    shown.forEach(function(r){
      var t = r.company_ticker || '';
      if (!groups.has(t)) groups.set(t, []);
      groups.get(t).push(r);
    });

    STATE.visible = [];
    var bandIdx = 0;
    groups.forEach(function(arr, ticker){
      var alt = (bandIdx % 2 === 1);
      var s = STATE.perTickerStats[ticker];
      var avg = s && s.n ? (s.sum / s.n) : null;
      var majCcy = '';
      if (s && s.n) {
        var ccys = Object.keys(s.ccyCount);
        ccys.sort(function(a, b){ return s.ccyCount[b] - s.ccyCount[a]; });
        majCcy = ccys[0] || '';
      }
      var ptIdx = 0;
      arr.forEach(function(r, i){
        r._alt = alt;
        r._isFirst = (i === 0);
        r._avgPt = avg;
        r._avgPtCcy = majCcy;
        if (s && s.n > 1) {
          if (r.price_target != null) {
            ptIdx++;
            r._avgPtSuffix = '<span class="n">' + ptIdx + '/' + s.n + '</span>';
          } else {
            r._avgPtSuffix = '<span class="n">·' + s.n + '</span>';
          }
        } else {
          r._avgPtSuffix = '';
        }
        STATE.visible.push(r);
      });
      bandIdx++;
    });

    // Sort/filter changed → reset page.
    STATE.page = 0;
    renderPage();
    updateCounts();
  }

  function renderPage(){
    var total = STATE.visible.length;
    var totalPages = Math.max(1, Math.ceil(total / STATE.pageSize));
    if (STATE.page >= totalPages) STATE.page = totalPages - 1;
    if (STATE.page < 0) STATE.page = 0;
    var start = STATE.page * STATE.pageSize;
    var slice = STATE.visible.slice(start, start + STATE.pageSize);

    // Build the whole tbody as one HTML string then assign once. innerHTML
    // is by far the cheapest way to mass-replace rows (browser parses it
    // in C++, no per-node JS overhead).
    tbody.innerHTML = slice.length
      ? slice.map(rowHtml).join('')
      : '<tr><td colspan="13" class="loading-cell">No rows match the current filter.</td></tr>';

    pageInfo.innerHTML = total === 0
      ? '<strong>0</strong> rows'
      : 'Page <strong>' + (STATE.page + 1) + '</strong> / ' + totalPages
        + ' · showing ' + (start + 1) + '–' + (start + slice.length)
        + ' of <strong>' + total + '</strong>';
    pagePrev.disabled = STATE.page === 0;
    pageNext.disabled = STATE.page >= totalPages - 1;
  }

  function updateCounts(){
    var seenTickers = {};
    var n = STATE.visible.length;
    var buy = 0, sell = 0;
    STATE.visible.forEach(function(r){
      seenTickers[r.company_ticker] = true;
      var rl = (r.rating || '').toLowerCase();
      if (rl.indexOf('buy')        >= 0 ||
          rl.indexOf('outperform') >= 0 ||
          rl.indexOf('overweight') >= 0 ||
          rl.indexOf('top pick')   >= 0) buy++;
      else if (rl.indexOf('sell')        >= 0 ||
               rl.indexOf('underweight') >= 0 ||
               rl.indexOf('underperform')>= 0) sell++;
    });
    countEl.textContent = n;
    upBuyEl.textContent = buy;
    upSellEl.textContent = sell;
    tickerCountEl.textContent = Object.keys(seenTickers).length;
  }

  function updateSortIndicators(){
    document.querySelectorAll('#pt thead th').forEach(function(th){
      var ind = th.querySelector('.sort-ind');
      if (!ind) return;
      ind.textContent = (th.dataset.key === STATE.sortKey)
        ? (STATE.sortDir === 'asc' ? '▲' : '▼')
        : '';
    });
  }

  function initSlider(){
    var allDates = STATE.all
      .map(function(r){ return parseDate(r.report_date); })
      .filter(function(t){ return !isNaN(t); });
    if (!allDates.length) {
      sliderEl.parentElement.style.display = 'none';
      STATE.minTs = -Infinity; STATE.maxTs = Infinity;
      STATE.curMinTs = STATE.minTs; STATE.curMaxTs = STATE.maxTs;
      return;
    }
    STATE.minTs = Math.min.apply(null, allDates);
    STATE.maxTs = Math.max.apply(null, allDates);
    if (STATE.minTs === STATE.maxTs) STATE.maxTs = STATE.minTs + ONE_DAY;
    STATE.curMinTs = STATE.minTs;
    STATE.curMaxTs = STATE.maxTs;

    noUiSlider.create(sliderEl, {
      start: [STATE.minTs, STATE.maxTs],
      connect: true,
      range: { min: STATE.minTs, max: STATE.maxTs },
      step: ONE_DAY,
      format: { to: function(v){ return v; }, from: function(v){ return Number(v); } }
    });
    sliderEl.noUiSlider.on('update', function(values){
      STATE.curMinTs = parseFloat(values[0]);
      STATE.curMaxTs = parseFloat(values[1]);
      dateMinEl.textContent = fmtDate(STATE.curMinTs);
      dateMaxEl.textContent = fmtDate(STATE.curMaxTs);
      recompute();
    });
  }

  function bindEvents(){
    var filterTimer = null;
    filter.addEventListener('input', function(){
      if (filterTimer) clearTimeout(filterTimer);
      filterTimer = setTimeout(recompute, 80);
    });

    pagePrev.addEventListener('click', function(){
      if (STATE.page > 0) { STATE.page--; renderPage(); }
    });
    pageNext.addEventListener('click', function(){
      var totalPages = Math.max(1, Math.ceil(STATE.visible.length / STATE.pageSize));
      if (STATE.page < totalPages - 1) { STATE.page++; renderPage(); }
    });
    pageSizeSel.addEventListener('change', function(){
      STATE.pageSize = parseInt(pageSizeSel.value, 10) || 100;
      STATE.page = 0;
      renderPage();
    });

    document.querySelectorAll('#pt thead th').forEach(function(th){
      th.addEventListener('click', function(){
        var key = th.dataset.key;
        if (!key) return;
        var isNum = th.dataset.num === '1';
        var defaultDir = th.dataset.defaultDir || (isNum ? 'desc' : 'asc');
        var dir = (STATE.sortKey === key)
          ? (STATE.sortDir === 'asc' ? 'desc' : 'asc')
          : defaultDir;
        STATE.sortKey = key; STATE.sortDir = dir;
        updateSortIndicators();
        recompute();
      });
    });
  }

  fetch('/pt/api/rows')
    .then(function(r){ return r.json(); })
    .then(function(rows){
      STATE.all = rows;
      initSlider();
      bindEvents();
      updateSortIndicators();
      recompute();
    })
    .catch(function(err){
      tbody.innerHTML = '<tr><td colspan="13" class="loading-cell" style="color:#f87171;">Failed to load: '
        + esc(err && err.message ? err.message : String(err)) + '</td></tr>';
    });
})();
</script>
</body>
</html>
