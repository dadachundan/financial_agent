<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Monitor - FinAgent</title>
<link rel="icon" href="data:,">
<link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --bg:#0b0d0f; --panel:#101214; --panel2:#15181b; --line:#262a2f;
    --grid:#1f2429; --fg:#d6d9de; --muted:#8d949d; --green:#00b894;
    --red:#ff475f; --blue:#2f6bff; --amber:#f0b429;
  }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden;
  }
  #_mainNav { margin-bottom:0 !important; border-bottom:1px solid var(--line); }
  .monitor-shell {
    height:calc(100dvh - var(--nav-h, 40px)); min-height:0;
    display:grid; grid-template-columns:minmax(540px,1fr) minmax(390px,420px);
  }
  .chart-pane {
    min-width:0; min-height:0; height:100%; max-height:100%; overflow:hidden;
    display:grid; grid-template-rows:auto minmax(0,1fr);
    border-right:1px solid var(--line); background:#0d0f11;
  }
  .toolbar { min-height:48px; display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--line); background:#111315; }
  .symbol-pill { min-width:92px; background:#2b2e33; color:#e9ecef; border-radius:20px; padding:7px 12px; font-weight:700; letter-spacing:.01em; }
  .timeframes, .chart-actions, .sort-tabs { display:flex; align-items:center; gap:4px; }
  .tool-btn, .tf-btn, .sort-btn {
    border:1px solid transparent; background:transparent; color:#c6cbd1; border-radius:7px;
    height:32px; min-width:34px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center;
  }
  .tool-btn:hover, .tf-btn:hover, .sort-btn:hover { background:#22262a; color:#fff; }
  .tf-btn.active, .sort-btn.active, .tool-btn.active { background:#34383e; color:#fff; border-color:#555b63; }
  .chart-wrap { position:relative; min-height:0; height:100%; overflow:hidden; }
  #priceChart { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #priceChart.dragging { cursor:grabbing; }
  .chart-title { position:absolute; left:16px; top:12px; z-index:2; pointer-events:none; }
  .chart-title .name { font-size:1.02rem; font-weight:650; color:#d9dde3; }
  .chart-title .meta { font-size:.78rem; color:#8d949d; margin-top:2px; }
  .chart-title .quote { display:flex; gap:10px; font-variant-numeric:tabular-nums; color:var(--muted); }
  .chart-title .quote .hover-date { color:#d7dbe1; font-weight:650; }
  .quote .down { color:var(--red); } .quote .up { color:var(--green); }
  .watermark { position:absolute; left:16px; bottom:14px; color:rgba(255,255,255,.10); font-size:2.1rem; font-weight:800; letter-spacing:-.04em; pointer-events:none; }
  .side-pane {
    min-width:0; min-height:0; height:100%; max-height:100%; overflow:hidden;
    background:var(--panel); display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto auto minmax(0,1fr);
    position:relative; z-index:3;
  }
  .side-filters {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:6px;
    padding:9px 12px; border-bottom:1px solid var(--line); background:#141719;
  }
  .chip {
    border:1px solid #2f343a; background:#191d21; color:#aeb4bc; border-radius:999px;
    height:26px; padding:0 11px; font-size:.74rem; font-weight:650; letter-spacing:.02em; white-space:nowrap;
  }
  .chip:hover { background:#22262a; color:#fff; }
  .chip.active { background:rgba(47,107,255,.18); border-color:#3d6ff5; color:#dce4ff; }
  .filter-label { color:#8d949d; font-size:.72rem; font-weight:650; letter-spacing:.04em; text-transform:uppercase; }
  .chip-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:6px; min-width:0; }
  .add-alert-wrap { display:none; padding:11px 12px; border-bottom:1px solid var(--line); background:#121518; }
  .add-alert-wrap.open { display:block; }
  .add-alert-form { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto auto; gap:8px; align-items:center; }
  .add-alert-form input {
    min-width:0; background:#0d0f11; border:1px solid #30343a; color:#e8eaed; height:34px;
    border-radius:7px; padding:0 10px; font-variant-numeric:tabular-nums;
  }
  .add-alert-form input:focus { outline:none; border-color:#5c88ff; box-shadow:0 0 0 3px rgba(47,107,255,.18); }
  .add-alert-form input::placeholder { color:#6d747d; }
  .btn-add {
    height:34px; padding:0 14px; border-radius:7px; border:1px solid #3d6ff5;
    background:rgba(47,107,255,.22); color:#dce4ff; font-size:.8rem; font-weight:700; white-space:nowrap;
  }
  .btn-add:hover { background:rgba(47,107,255,.34); }
  .btn-add:disabled { opacity:.55; cursor:default; }
  .add-alert-status { margin-top:8px; font-size:.74rem; color:#8d949d; min-height:0; }
  .add-alert-status.error { color:#ff8a9b; }
  .add-alert-status.ok { color:#5fd6b4; }
  .side-tools { display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid var(--line); background:#17191c; }
  .search { flex:1; min-width:100px; background:#0d0f11; border:1px solid #30343a; color:#e8eaed; height:34px; border-radius:7px; padding:0 10px; }
  .search:focus { outline:none; border-color:#5c88ff; box-shadow:0 0 0 3px rgba(47,107,255,.18); }
  .sort-dir { min-width:32px; padding:0 8px; font-size:1rem; font-weight:750; }
  .sort-label { color:#aeb4bc; font-size:.82rem; font-weight:650; padding-left:4px; }
  .alert-list { min-width:0; min-height:0; justify-self:stretch; overflow-x:hidden; overflow-y:auto; }
  .alert-row-wrap { position:relative; }
  .alert-row {
    width:100%; box-sizing:border-box; display:block; text-align:left;
    background:transparent; color:var(--fg); border:0; border-bottom:1px solid var(--line); padding:14px;
  }
  .alert-row:hover { background:#161a1e; }
  .alert-row.active { background:#1a1f25; box-shadow:inset 3px 0 0 var(--blue); }
  .row-delete {
    position:absolute; top:10px; right:10px; height:22px; min-width:22px; padding:0 6px;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid transparent; border-radius:6px; background:transparent;
    color:#6f767f; font-size:.98rem; font-weight:650; line-height:1;
  }
  .row-delete:hover { background:#2a2f35; color:#fff; border-color:#3a4048; }
  .row-delete.confirm { color:#ff8a9b; border-color:#7d3038; background:rgba(255,71,95,.14); font-size:.72rem; }
  .row-delete.confirm:hover { background:rgba(255,71,95,.26); color:#ffd7dd; }
  .alert-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:baseline; padding-right:26px; }
  .alert-row-wrap.confirming .alert-head { padding-right:64px; }
  .head-main { min-width:0; display:flex; flex-direction:column; gap:4px; }
  .desc { font-size:.96rem; line-height:1.2; color:#d4d7dc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .company-line { display:flex; align-items:center; gap:6px; min-width:0; }
  .company { min-width:0; font-size:.76rem; line-height:1.15; color:#8d949d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Chinese name first for China-listed companies, the English one dimmed after it.
     The English name carries the shrink weight so the Chinese one stays readable. */
  .company.cn { color:#c9ced5; }
  .company-en { flex:1 100 auto; min-width:0; font-size:.72rem; line-height:1.15; color:#737a83; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .exch {
    flex:0 0 auto; font-size:.62rem; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
    color:#9aa1aa; border:1px solid #333941; background:#1b1f23; border-radius:4px; padding:1px 5px;
  }
  .exch-nasdaq { color:#7fa8ff; border-color:#2f4a7d; background:rgba(47,107,255,.12); }
  .exch-ashare { color:#ff8a9b; border-color:#7d3038; background:rgba(255,71,95,.12); }
  .exch-hkex   { color:#f0c260; border-color:#7d6528; background:rgba(240,180,41,.12); }
  .exch-nyse   { color:#5fd6b4; border-color:#2b6b5a; background:rgba(0,184,148,.12); }
  .pct { font-size:1.08rem; line-height:1; font-weight:750; font-variant-numeric:tabular-nums; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .price-grid { display:grid; grid-template-columns:1.35fr repeat(3,minmax(0,1fr)); gap:10px; align-items:end; margin-top:12px; }
  .metric { min-width:0; font-variant-numeric:tabular-nums; }
  .metric-label { display:block; color:#747b84; font-size:.68rem; line-height:1; text-transform:uppercase; }
  .metric-value { display:block; margin-top:5px; color:#b9bec6; font-size:.82rem; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .metric.current .metric-label { color:#9299a2; }
  .metric.current .metric-value { color:#f2f4f7; font-size:1.3rem; font-weight:720; }
  .empty, .loading { color:var(--muted); padding:26px 16px; text-align:center; }
  .divider { width:1px; height:28px; background:var(--line); margin:0 4px; }
  .chart-hint { color:#8d949d; white-space:nowrap; }
  @media (max-width: 980px) {
    body { overflow:auto; }
    .monitor-shell { flex:0 0 auto; min-height:900px; grid-template-columns:1fr; grid-template-rows:520px 1fr; }
    .chart-pane { border-right:0; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
{{ NAV_HTML | safe }}
<main class="monitor-shell">
  <section class="chart-pane">
    <div class="toolbar">
      <div id="symbolPill" class="symbol-pill">{{ initial_symbol }}</div>
      <div class="divider"></div>
      <div class="timeframes" aria-label="Time range">
        <button class="tf-btn" data-period="1mo" type="button">1m</button>
        <button class="tf-btn" data-period="3mo" type="button">3m</button>
        <button class="tf-btn" data-period="6mo" type="button">6m</button>
        <button class="tf-btn active" data-period="1y" type="button">1Y</button>
        <button class="tf-btn" data-period="2y" type="button">2Y</button>
      </div>
      <div class="divider"></div>
      <div class="chart-actions" aria-label="Chart controls">
        <button id="zoomIn" class="tool-btn" type="button" title="Zoom in">+</button>
        <button id="zoomOut" class="tool-btn" type="button" title="Zoom out">-</button>
        <button id="resetZoom" class="tool-btn" type="button" title="Reset zoom">Reset</button>
      </div>
      <div class="ms-auto small chart-hint">Wheel zoom, drag pan</div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">
        <div id="chartName" class="name">Loading...</div>
        <div id="chartMeta" class="meta"></div>
        <div id="chartQuote" class="quote"></div>
      </div>
      <canvas id="priceChart"></canvas>
      <div class="watermark">FinAgent</div>
    </div>
  </section>
  <aside class="side-pane">
    <div class="side-filters">
      <span class="filter-label">Exchange</span>
      <div id="exchangeFilters" class="chip-row" role="group" aria-label="Filter by market"></div>
    </div>
    <div class="side-tools">
      <input id="alertSearch" class="search" placeholder="Search alerts">
      <div class="sort-tabs">
        <span class="sort-label">Move</span>
        <button id="sortDirection" class="sort-btn sort-dir" type="button" title="Ascending: lowest move first" aria-label="Sort move ascending">&#8593;</button>
      </div>
      <button id="refreshAlerts" class="tool-btn" type="button" title="Refresh prices">Refresh</button>
      <button id="toggleAddAlert" class="tool-btn" type="button" title="Add an alert" aria-expanded="false" aria-controls="addAlertWrap">+ Add</button>
    </div>
    <div id="addAlertWrap" class="add-alert-wrap">
      <form id="addAlertForm" class="add-alert-form" autocomplete="off">
        <input id="addSymbol" type="text" placeholder="Symbol e.g. MSFT" title="US ticker (MSFT), A-share code (601899) or Hong Kong code (6869 / 6869.HK)" aria-label="Symbol" spellcheck="false">
        <input id="addPrice" type="number" step="any" min="0" placeholder="Target price" aria-label="Target price" inputmode="decimal">
        <button id="addSubmit" class="btn-add" type="submit">Add</button>
        <button id="addCancel" class="chip" type="button">Cancel</button>
      </form>
      <div id="addStatus" class="add-alert-status" hidden></div>
    </div>
    <div id="alertList" class="alert-list">
      <div class="loading">Loading alerts...</div>
    </div>
  </aside>
</main>

<script>
(function(){
  var alerts = [];
  var bars = [];
  var selected = null;
  var period = '1y';
  var sortDirection = 'asc';
  var searchText = '';
  var exchangeFilter = '';
  var focusId = '';
  var pendingDelete = '';
  var MARKET_ORDER = ['US', 'A-Share', 'HKEX', 'Other'];
  var view = { start: 0, end: 0 };
  var drag = null;
  var hoveredDate = '';
  var CHART_PAD = { left:18, right:78, top:106, bottom:42 };

  var els = {
    list: document.getElementById('alertList'),
    search: document.getElementById('alertSearch'),
    refresh: document.getElementById('refreshAlerts'),
    sortDirection: document.getElementById('sortDirection'),
    exchangeFilters: document.getElementById('exchangeFilters'),
    addWrap: document.getElementById('addAlertWrap'),
    addForm: document.getElementById('addAlertForm'),
    addToggle: document.getElementById('toggleAddAlert'),
    addSymbol: document.getElementById('addSymbol'),
    addPrice: document.getElementById('addPrice'),
    addSubmit: document.getElementById('addSubmit'),
    addCancel: document.getElementById('addCancel'),
    addStatus: document.getElementById('addStatus'),
    symbol: document.getElementById('symbolPill'),
    chartName: document.getElementById('chartName'),
    chartMeta: document.getElementById('chartMeta'),
    chartQuote: document.getElementById('chartQuote'),
    canvas: document.getElementById('priceChart')
  };
  var ctx = els.canvas.getContext('2d');

  function syncNavHeight(){
    var nav = document.getElementById('_mainNav');
    document.documentElement.style.setProperty('--nav-h', ((nav ? nav.offsetHeight : 40) || 40) + 'px');
  }

  function fmt(n, digits){
    if(n == null || Number.isNaN(Number(n))) return '-';
    return Number(n).toLocaleString(undefined, {minimumFractionDigits: digits, maximumFractionDigits: digits});
  }
  function fmtPct(n){
    if(n == null) return '-';
    return (n >= 0 ? '+' : '') + fmt(n, 2) + '%';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function directionCls(n){ return n == null ? '' : (n >= 0 ? 'pos' : 'neg'); }
  function setAddStatus(text, cls){
    if(!text){
      els.addStatus.hidden = true;
      els.addStatus.textContent = '';
      els.addStatus.className = 'add-alert-status';
      return;
    }
    els.addStatus.hidden = false;
    els.addStatus.textContent = text;
    els.addStatus.className = 'add-alert-status' + (cls ? ' ' + cls : '');
  }
  function openAddForm(){
    els.addWrap.classList.add('open');
    els.addToggle.classList.add('active');
    els.addToggle.setAttribute('aria-expanded', 'true');
    els.addSymbol.focus();
  }
  function closeAddForm(){
    els.addWrap.classList.remove('open');
    els.addToggle.classList.remove('active');
    els.addToggle.setAttribute('aria-expanded', 'false');
    setAddStatus('');
  }

  async function deleteAlert(id){
    try {
      var res = await fetch('/alert-monitor/api/alerts/' + encodeURIComponent(id), { method: 'DELETE' });
      var data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Could not delete the alert.');
      pendingDelete = '';
      await loadAlerts(false);
    } catch(err) {
      pendingDelete = '';
      renderAlerts();
      window.alert(err.message);
    }
  }

  async function submitAddAlert(e){
    e.preventDefault();
    var symbol = els.addSymbol.value.trim();
    var rawPrice = els.addPrice.value.trim();
    if(!symbol){ setAddStatus('Enter a symbol.', 'error'); els.addSymbol.focus(); return; }
    if(!rawPrice || !(Number(rawPrice) > 0)){
      setAddStatus('Enter a target price greater than zero.', 'error');
      els.addPrice.focus();
      return;
    }
    els.addSubmit.disabled = true;
    els.addSubmit.textContent = 'Adding...';
    setAddStatus('Adding ' + symbol.toUpperCase() + '...');
    try {
      var res = await fetch('/alert-monitor/api/alerts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ symbol: symbol, alert_price: Number(rawPrice) })
      });
      var data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Could not add the alert.');
      focusId = data.alert.id;
      els.addSymbol.value = '';
      els.addPrice.value = '';
      await loadAlerts(false);
      setAddStatus(data.alert.description + ' (' + (data.alert.company || data.alert.yf_symbol) +
        ', ' + (data.alert.exchange || 'unknown venue') + ') added.', 'ok');
    } catch(err) {
      setAddStatus(err.message, 'error');
    } finally {
      els.addSubmit.disabled = false;
      els.addSubmit.textContent = 'Add';
    }
  }
  function exchangeCls(ex){
    var k = String(ex || '').toUpperCase();
    if(k === 'NASDAQ') return 'exch-nasdaq';
    if(k === 'A-SHARE') return 'exch-ashare';
    if(k === 'HKEX') return 'exch-hkex';
    if(k.indexOf('NYSE') === 0 || k === 'AMEX' || k === 'BATS') return 'exch-nyse';
    return '';
  }

  // The chips filter by market (US / A-Share / HKEX / Other), not by venue:
  // NASDAQ, NYSE and NYSE Arca are all "US".
  function marketList(){
    var seen = {};
    alerts.forEach(function(a){ if(a.market) seen[a.market] = true; });
    var known = MARKET_ORDER.filter(function(x){ return seen[x]; });
    var extra = Object.keys(seen).filter(function(x){ return MARKET_ORDER.indexOf(x) < 0; }).sort();
    return known.concat(extra);
  }

  function renderExchangeFilters(){
    var list = marketList();
    if(exchangeFilter && list.indexOf(exchangeFilter) < 0) exchangeFilter = '';
    var html = '<button class="chip ' + (exchangeFilter ? '' : 'active') + '" data-exchange="" type="button">All</button>';
    list.forEach(function(ex){
      html += '<button class="chip ' + (exchangeFilter === ex ? 'active' : '') + '" data-exchange="' + esc(ex) +
        '" type="button" title="Filter by ' + esc(ex) + '">' + esc(ex) + '</button>';
    });
    els.exchangeFilters.innerHTML = html;
  }

  function filteredAlerts(){
    var q = searchText.trim().toLowerCase();
    var rows = alerts.map(function(a, i){ return Object.assign({index:i}, a); });
    if(exchangeFilter){
      rows = rows.filter(function(a){ return a.market === exchangeFilter; });
    }
    if(q){
      rows = rows.filter(function(a){
        return [a.ticker, a.yf_symbol, a.description, a.company, a.company_cn, a.exchange].join(' ').toLowerCase().indexOf(q) >= 0;
      });
    }
    rows.sort(function(a,b){
      if(a.diff_pct == null && b.diff_pct == null) return 0;
      if(a.diff_pct == null) return 1;
      if(b.diff_pct == null) return -1;
      return sortDirection === 'asc' ? a.diff_pct - b.diff_pct : b.diff_pct - a.diff_pct;
    });
    return rows;
  }

  function renderAlerts(){
    var rows = filteredAlerts();
    els.sortDirection.textContent = String.fromCharCode(sortDirection === 'asc' ? 8593 : 8595);
    els.sortDirection.title = sortDirection === 'asc' ? 'Ascending: lowest move first' : 'Descending: highest move first';
    els.sortDirection.setAttribute('aria-label', sortDirection === 'asc' ? 'Sort move ascending' : 'Sort move descending');
    if(!rows.length){
      els.list.innerHTML = '<div class="empty">No matching alerts.</div>';
      return;
    }
    els.list.innerHTML = rows.map(function(a){
      var active = selected && selected.id
        ? selected.id === a.id
        : !!(selected && selected.description === a.description && selected.alert_price === a.alert_price);
      var diffClass = directionCls(a.diff_pct);
      var addedDate = a.created_at ? a.created_at.slice(0, 10) : '';
      var meta = [a.company_cn, a.company, a.exchange_full || a.exchange,
                  addedDate ? 'added ' + addedDate : '']
        .filter(function(v, i, arr){ return v && arr.indexOf(v) === i; }).join(' · ');
      var confirming = a.id && pendingDelete === a.id;
      var action = !a.id ? '' :
        '<button class="row-delete' + (confirming ? ' confirm' : '') + '" data-id="' + esc(a.id) + '" type="button" ' +
        'title="' + (confirming ? 'Click again to delete this alert' : 'Delete this alert (its history is kept)') + '" ' +
        'aria-label="' + (confirming ? 'Confirm delete ' : 'Delete ') + esc(a.description) + '">' +
        (confirming ? 'Delete?' : '&times;') + '</button>';
      return '<div class="alert-row-wrap' + (confirming ? ' confirming' : '') + '">' +
        '<button class="alert-row' + (active ? ' active' : '') + '" data-index="' + a.index + '" type="button">' +
        '<div class="alert-head"><div class="head-main">' +
        '<span class="desc">' + esc(a.description) + '</span>' +
        '<span class="company-line">' +
        (a.company_cn
          ? '<span class="company cn" title="' + esc(meta) + '">' + esc(a.company_cn) + '</span>' +
            (a.company ? '<span class="company-en" title="' + esc(meta) + '">' + esc(a.company) + '</span>' : '')
          : (a.company ? '<span class="company" title="' + esc(meta) + '">' + esc(a.company) + '</span>' : '')) +
        (a.exchange ? '<span class="exch ' + exchangeCls(a.exchange) + '" title="' + esc(a.exchange_full || a.exchange) + '">' + esc(a.exchange) + '</span>' : '') +
        '</span>' +
        '</div>' +
        '<span class="pct ' + diffClass + '">' + fmtPct(a.diff_pct) + '</span></div>' +
        '<div class="price-grid">' +
        '<div class="metric current"><span class="metric-label">Current</span><span class="metric-value">' + fmt(a.current_price, 2) + '</span></div>' +
        '<div class="metric"><span class="metric-label">Alert</span><span class="metric-value">' + fmt(a.alert_price, 2) + '</span></div>' +
        '<div class="metric"><span class="metric-label">1Y Low</span><span class="metric-value">' + fmt(a.low_1y, 2) + '</span></div>' +
        '<div class="metric"><span class="metric-label">1Y High</span><span class="metric-value">' + fmt(a.high_1y, 2) + '</span></div>' +
        '</div></button>' + action +
        '</div>';
    }).join('');
  }

  async function loadHistory(alert){
    selected = alert;
    hoveredDate = '';
    els.symbol.textContent = alert.yf_symbol;
    els.chartName.textContent = alert.description;
    els.chartMeta.textContent = [alert.company_cn, alert.company, alert.exchange_full || alert.exchange,
      alert.created_at ? 'added ' + alert.created_at.slice(0, 10) : '']
      .filter(function(v, i, arr){ return v && arr.indexOf(v) === i; }).join(' · ');
    els.chartQuote.innerHTML = '<span>Alert ' + fmt(alert.alert_price, 2) + '</span><span class="' + directionCls(alert.diff_pct) + '">' + fmtPct(alert.diff_pct) + '</span>';
    renderAlerts();
    var res = await fetch('/alert-monitor/api/history/' + encodeURIComponent(alert.yf_symbol) + '?period=' + encodeURIComponent(period)).then(function(r){ return r.json(); });
    if(!res.ok || !res.bars.length){
      els.chartName.textContent = alert.yf_symbol + ' - no chart data';
      bars = [];
      resizeCanvas();
      return;
    }
    bars = res.bars;
    view.start = 0;
    view.end = bars.length;
    drawChart();
  }

  function resizeCanvas(){
    syncNavHeight();
    var rect = els.canvas.getBoundingClientRect();
    var ratio = window.devicePixelRatio || 1;
    els.canvas.width = Math.max(1, Math.floor(rect.width * ratio));
    els.canvas.height = Math.max(1, Math.floor(rect.height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    drawChart();
  }

  function visibleBars(){
    if(!bars.length) return [];
    var s = Math.max(0, Math.floor(view.start));
    var e = Math.min(bars.length, Math.ceil(view.end));
    return bars.slice(s, e);
  }

  function niceTicks(min, max, count){
    if(!isFinite(min) || !isFinite(max) || min === max) return [];
    var raw = (max - min) / Math.max(1, count - 1);
    var pow = Math.pow(10, Math.floor(Math.log10(raw)));
    var step = pow;
    if(raw / pow > 5) step = 10 * pow;
    else if(raw / pow > 2) step = 5 * pow;
    else if(raw / pow > 1) step = 2 * pow;
    var first = Math.ceil(min / step) * step;
    var out = [];
    for(var v = first; v <= max + step * 0.25; v += step) out.push(v);
    return out;
  }

  function drawChart(){
    var w = els.canvas.clientWidth;
    var h = els.canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0d0f11';
    ctx.fillRect(0, 0, w, h);
    if(!bars.length || !selected){
      ctx.fillStyle = '#8d949d';
      ctx.font = '14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
      ctx.fillText('No chart data', 16, 84);
      return;
    }
    var vbars = visibleBars();
    if(!vbars.length) return;
    var pad = CHART_PAD;
    var plotW = Math.max(20, w - pad.left - pad.right);
    var plotH = Math.max(20, h - pad.top - pad.bottom);
    var hi = Math.max.apply(null, vbars.map(function(b){ return Number(b.high); }).concat([selected.alert_price]));
    var lo = Math.min.apply(null, vbars.map(function(b){ return Number(b.low); }).concat([selected.alert_price]));
    var span = Math.max(0.01, hi - lo);
    hi += span * 0.08;
    lo -= span * 0.08;
    var xFor = function(i){ return pad.left + (i + 0.5) * (plotW / vbars.length); };
    var yFor = function(v){ return pad.top + ((hi - v) / (hi - lo)) * plotH; };
    var ticks = niceTicks(lo, hi, 6);

    ctx.strokeStyle = '#1f2429';
    ctx.lineWidth = 1;
    ticks.forEach(function(t){
      var y = yFor(t);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
      ctx.fillStyle = '#a9afb7';
      ctx.font = '12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(fmt(t, 2), w - pad.right + 10, y);
    });
    var verticalCount = Math.min(8, vbars.length);
    for(var gx = 0; gx <= verticalCount; gx++){
      var x = pad.left + gx * plotW / verticalCount;
      ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, h - pad.bottom); ctx.stroke();
    }

    var alertY = yFor(selected.alert_price);
    ctx.strokeStyle = '#c8ccd2';
    ctx.setLineDash([7, 7]);
    ctx.beginPath(); ctx.moveTo(pad.left, alertY); ctx.lineTo(w - pad.right, alertY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#c8ccd2';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(fmt(selected.alert_price, 2), w - pad.right + 10, alertY);

    var slot = plotW / vbars.length;
    var bodyW = Math.max(2, Math.min(12, slot * 0.62));
    vbars.forEach(function(b, i){
      var o = Number(b.open), c = Number(b.close), high = Number(b.high), low = Number(b.low);
      if(!isFinite(o) || !isFinite(c) || !isFinite(high) || !isFinite(low)) return;
      var x = xFor(i);
      var up = c >= o;
      var color = up ? '#00b894' : '#ff475f';
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x, yFor(high)); ctx.lineTo(x, yFor(low)); ctx.stroke();
      var y1 = yFor(Math.max(o, c));
      var y2 = yFor(Math.min(o, c));
      var bodyH = Math.max(1, y2 - y1);
      if(up){
        ctx.strokeRect(x - bodyW / 2, y1, bodyW, bodyH);
      } else {
        ctx.fillRect(x - bodyW / 2, y1, bodyW, bodyH);
      }
    });

    var hoverIndex = hoveredDate ? vbars.findIndex(function(b){ return b.date === hoveredDate; }) : -1;
    if(hoverIndex >= 0){
      var hoverBar = vbars[hoverIndex];
      var hoverX = xFor(hoverIndex);
      var hoverY = yFor(Number(hoverBar.close));
      ctx.save();
      ctx.strokeStyle = 'rgba(215,219,225,.65)';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(hoverX, pad.top); ctx.lineTo(hoverX, h - pad.bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad.left, hoverY); ctx.lineTo(w - pad.right, hoverY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
      ctx.textBaseline = 'middle';
      var priceText = fmt(hoverBar.close, 2);
      var priceWidth = ctx.measureText(priceText).width + 14;
      ctx.fillStyle = '#343941';
      ctx.fillRect(w - pad.right + 4, hoverY - 11, priceWidth, 22);
      ctx.fillStyle = '#f2f4f7';
      ctx.textAlign = 'left';
      ctx.fillText(priceText, w - pad.right + 11, hoverY);
      var dateWidth = ctx.measureText(hoverBar.date).width + 14;
      var dateX = Math.max(pad.left, Math.min(w - pad.right - dateWidth, hoverX - dateWidth / 2));
      ctx.fillStyle = '#343941';
      ctx.fillRect(dateX, h - pad.bottom + 5, dateWidth, 23);
      ctx.fillStyle = '#f2f4f7';
      ctx.textAlign = 'center';
      ctx.fillText(hoverBar.date, dateX + dateWidth / 2, h - pad.bottom + 16.5);
      ctx.restore();
    }

    ctx.fillStyle = '#8d949d';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    var labelEvery = Math.max(1, Math.ceil(vbars.length / 7));
    vbars.forEach(function(b, i){
      if(i % labelEvery !== 0 && i !== vbars.length - 1) return;
      if(hoverIndex >= 0 && Math.abs(i - hoverIndex) < Math.max(1, labelEvery / 2)) return;
      ctx.fillText(b.date.slice(5), xFor(i), h - pad.bottom + 14);
    });

    ctx.strokeStyle = '#303640';
    ctx.strokeRect(pad.left, pad.top, plotW, plotH);

    var lastBar = hoverIndex >= 0 ? vbars[hoverIndex] : bars[bars.length - 1];
    var first = Number(bars[0].close);
    var last = Number(lastBar.close);
    var chg = hoverIndex >= 0
      ? (Number(lastBar.open) ? ((last - Number(lastBar.open)) / Number(lastBar.open)) * 100 : null)
      : (first ? ((last - first) / first) * 100 : null);
    els.chartQuote.innerHTML = (hoverIndex >= 0 ? '<span class="hover-date">' + esc(lastBar.date) + '</span>' : '') +
      '<span>O ' + fmt(lastBar.open, 2) + '</span>' +
      '<span>H ' + fmt(lastBar.high, 2) + '</span>' +
      '<span>L ' + fmt(lastBar.low, 2) + '</span>' +
      '<span>C ' + fmt(last, 2) + '</span>' +
      '<span class="' + directionCls(chg) + '">' + fmtPct(chg) + '</span>' +
      '<span>Alert ' + fmt(selected.alert_price, 2) + '</span>';
  }

  function zoom(factor){
    if(!bars.length) return;
    var len = view.end - view.start;
    var center = (view.start + view.end) / 2;
    var next = Math.max(12, Math.min(bars.length, len / factor));
    view.start = Math.max(0, center - next / 2);
    view.end = Math.min(bars.length, center + next / 2);
    if(view.end - view.start < next){
      if(view.start === 0) view.end = Math.min(bars.length, next);
      if(view.end === bars.length) view.start = Math.max(0, bars.length - next);
    }
    drawChart();
  }

  function pan(deltaBars){
    if(!bars.length) return;
    var len = view.end - view.start;
    view.start = Math.max(0, Math.min(bars.length - len, view.start + deltaBars));
    view.end = view.start + len;
    drawChart();
  }

  async function loadAlerts(refresh){
    var previousId = selected && selected.id ? selected.id : '';
    var previous = selected ? selected.description + '|' + selected.alert_price : '';
    els.list.innerHTML = '<div class="loading">Loading alerts...</div>';
    var params = [];
    if(refresh) params.push('refresh=1');
    var url = '/alert-monitor/api/alerts' + (params.length ? '?' + params.join('&') : '');
    var res = await fetch(url).then(function(r){ return r.json(); });
    alerts = res.alerts || [];
    pendingDelete = '';
    selected = alerts.find(function(a){ return focusId && a.id === focusId; })
      || alerts.find(function(a){ return previousId && a.id === previousId; })
      || alerts.find(function(a){ return previous && previous === a.description + '|' + a.alert_price; })
      || alerts[0] || null;
    focusId = '';
    renderExchangeFilters();
    renderAlerts();
    if(selected) loadHistory(selected);
  }

  document.querySelectorAll('.tf-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tf-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      period = btn.getAttribute('data-period');
      if(selected) loadHistory(selected);
    });
  });
  els.list.addEventListener('click', function(e){
    var del = e.target.closest('.row-delete');
    if(del){
      var id = del.getAttribute('data-id');
      if(pendingDelete === id){ deleteAlert(id); return; }
      pendingDelete = id;
      renderAlerts();
      return;
    }
    var row = e.target.closest('.alert-row');
    if(!row) return;
    if(pendingDelete){ pendingDelete = ''; renderAlerts(); }
    loadHistory(alerts[Number(row.getAttribute('data-index'))]);
  });
  els.search.addEventListener('input', function(){
    searchText = els.search.value;
    pendingDelete = '';
    renderAlerts();
  });
  els.exchangeFilters.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    var next = chip.getAttribute('data-exchange') || '';
    if(next === exchangeFilter) return;
    exchangeFilter = next;
    pendingDelete = '';
    renderExchangeFilters();
    renderAlerts();
  });
  els.refresh.addEventListener('click', function(){ loadAlerts(true); });
  els.addForm.addEventListener('submit', submitAddAlert);
  els.addToggle.addEventListener('click', function(){
    if(els.addWrap.classList.contains('open')) closeAddForm();
    else openAddForm();
  });
  els.addCancel.addEventListener('click', function(){
    els.addSymbol.value = '';
    els.addPrice.value = '';
    closeAddForm();
  });
  els.addSymbol.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeAddForm();
  });
  els.addPrice.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeAddForm();
  });
  els.sortDirection.addEventListener('click', function(){
    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    renderAlerts();
  });
  document.getElementById('zoomIn').addEventListener('click', function(){ zoom(1.25); });
  document.getElementById('zoomOut').addEventListener('click', function(){ zoom(0.8); });
  document.getElementById('resetZoom').addEventListener('click', function(){ view.start = 0; view.end = bars.length; drawChart(); });
  els.canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.18 : 0.85);
  }, { passive:false });
  els.canvas.addEventListener('pointerdown', function(e){
    hoveredDate = '';
    drag = { x:e.clientX, start:view.start, end:view.end };
    els.canvas.classList.add('dragging');
    els.canvas.setPointerCapture(e.pointerId);
  });
  els.canvas.addEventListener('pointermove', function(e){
    if(!bars.length) return;
    if(!drag){
      var rect = els.canvas.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var vbars = visibleBars();
      var plotW = Math.max(20, rect.width - CHART_PAD.left - CHART_PAD.right);
      if(!vbars.length || x < CHART_PAD.left || x > rect.width - CHART_PAD.right || y < CHART_PAD.top || y > rect.height - CHART_PAD.bottom){
        if(hoveredDate){ hoveredDate = ''; drawChart(); }
        return;
      }
      var slot = plotW / vbars.length;
      var index = Math.max(0, Math.min(vbars.length - 1, Math.floor((x - CHART_PAD.left) / slot)));
      if(hoveredDate !== vbars[index].date){ hoveredDate = vbars[index].date; drawChart(); }
      return;
    }
    var rect = els.canvas.getBoundingClientRect();
    var barsPerPx = (drag.end - drag.start) / Math.max(1, rect.width - 96);
    view.start = drag.start - (e.clientX - drag.x) * barsPerPx;
    view.end = drag.end - (e.clientX - drag.x) * barsPerPx;
    pan(0);
  });
  els.canvas.addEventListener('pointerup', function(e){
    drag = null;
    els.canvas.classList.remove('dragging');
    try { els.canvas.releasePointerCapture(e.pointerId); } catch(_e) {}
  });
  els.canvas.addEventListener('pointerleave', function(){
    if(!drag && hoveredDate){ hoveredDate = ''; drawChart(); }
  });
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && pendingDelete){ pendingDelete = ''; renderAlerts(); }
  });

  syncNavHeight();
  resizeCanvas();
  loadAlerts(false);
})();
</script>
</body>
</html>
