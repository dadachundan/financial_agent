<text x="58.00" y="766.00" text-anchor="start" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">电力与天然气</text>
<text x="58.00" y="790.00" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" xml:space="preserve"><tspan fill="#9aa3b8" font-weight="400">空分(ASU)耗电、蒸汽甲烷重整(SMR)耗天然气是</tspan><tspan fill="#9aa3b8" font-weight="400"> APD</tspan><tspan fill="#9aa3b8" font-weight="400"> 最大的可变成本。驻厂合同含</tspan><tspan fill="#f4d58a" font-weight="700"> 成本传导条款</tspan></text>
<text x="58.00" y="806.00" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" xml:space="preserve"><tspan fill="#f4d58a" font-weight="700">(cost</tspan><tspan fill="#f4d58a" font-weight="700"> pass-through)</tspan><tspan fill="#9aa3b8" font-weight="400"> ，把电力/天然气/烃类价格波动转嫁给客户，保护单位毛利。</tspan></text>
