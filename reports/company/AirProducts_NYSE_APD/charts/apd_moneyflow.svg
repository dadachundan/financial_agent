<text x="428.00" y="790.00" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" xml:space="preserve"><tspan fill="#9aa3b8" font-weight="400">FY2025</tspan><tspan fill="#9aa3b8" font-weight="400"> 资本开支高达</tspan><tspan fill="#f4d58a" font-weight="700"> $7.02bn</tspan><tspan fill="#9aa3b8" font-weight="400"> ，主要建造空分、重整与气化装置；FY2026</tspan><tspan fill="#9aa3b8" font-weight="400"> 指引降至约</tspan></text>
<text x="428.00" y="806.00" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" xml:space="preserve"><tspan fill="#f4d58a" font-weight="700">$4.0bn</tspan><tspan fill="#9aa3b8" font-weight="400"> ，是维权股东驱动的资本纪律的核心体现。</tspan></text>
