<text x="798.00" y="790.00" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" xml:space="preserve"><tspan fill="#9aa3b8" font-weight="400">NEOM</tspan><tspan fill="#9aa3b8" font-weight="400"> 绿氢项目通过</tspan><tspan fill="#f4d58a" font-weight="700"> NGHC</tspan><tspan fill="#9aa3b8" font-weight="400"> 合资公司推进，APD</tspan><tspan fill="#9aa3b8" font-weight="400"> 与</tspan><tspan fill="#f4d58a" font-weight="700"> ACWA</tspan><tspan fill="#f4d58a" font-weight="700"> Power</tspan><tspan fill="#9aa3b8" font-weight="400"> 、</tspan><tspan fill="#f4d58a" font-weight="700"> NEOM</tspan></text>
<text x="798.00" y="806.00" font-family="'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" xml:space="preserve"><tspan fill="#f4d58a" font-weight="700">Company</tspan><tspan fill="#9aa3b8" font-weight="400"> 三方等额持股；APD</tspan><tspan fill="#9aa3b8" font-weight="400"> 是绿氨的独家承购方，目标</tspan><tspan fill="#f4d58a" font-weight="700"> 2027</tspan><tspan fill="#9aa3b8" font-weight="400"> 年投产。</tspan></text>
